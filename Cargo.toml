[workspace]
resolver = "2"
members = ["crates/nanobuf-diagnostics", "crates/nanobuf-syntax", "crates/nanobuf-schema", "crates/nanobuf", "crates/nanobuf-codegen", "conformance", "crates/nanobuf-proto", "crates/nanoc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
